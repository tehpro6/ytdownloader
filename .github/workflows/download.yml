name: Descargar video

on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID del video de YouTube (11 caracteres)"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar yt-dlp
        run: pip install -U yt-dlp

      - name: Descargar
        env:
          VID: ${{ inputs.id }}
        run: |
          if [[ ! "$VID" =~ ^[A-Za-z0-9_-]{11}$ ]]; then
            echo "ID inválido"; exit 1
          fi
          mkdir descargas
          yt-dlp -o "descargas/%(title)s [%(id)s].%(ext)s" "https://www.youtube.com/watch?v=$VID"

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.id }}
          path: descargas/*
          retention-days: 7
