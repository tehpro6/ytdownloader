<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hello World</title>
</head>
<body>Hello World

<script>
// Funciona en https://USUARIO.github.io/REPO/
// Deduce usuario y repo desde la URL.
const OWNER = location.hostname.split(".")[0];
const REPO = location.pathname.split("/")[1];
const BRANCH = "main";
const ID_RE = /^[\w-]{11}$/;

function getToken() {
  // Se pide una vez y solo vive en esta pestaña (nunca va en el repo).
  let t = sessionStorage.getItem("gh_token");
  if (!t) {
    t = prompt("Token de GitHub (fine-grained, permiso Actions: read/write en este repo):");
    if (t) sessionStorage.setItem("gh_token", t.trim());
  }
  return t;
}

async function descargar(id) {
  const token = getToken();
  if (!token) return;
  document.title = "Enviando " + id + "...";
  const r = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/download.yml/dispatches`,
    {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token,
        Accept: "application/vnd.github+json"
      },
      body: JSON.stringify({ ref: BRANCH, inputs: { id } })
    }
  );
  if (r.status === 204) {
    document.title = "Workflow lanzado: " + id;
    window.open(`https://github.com/${OWNER}/${REPO}/actions`, "_blank");
  } else {
    document.title = "Error " + r.status;
    if (r.status === 401) sessionStorage.removeItem("gh_token");
    console.error(await r.text());
  }
}

document.addEventListener("paste", (e) => {
  const id = (e.clipboardData.getData("text") || "").trim();
  if (ID_RE.test(id)) descargar(id);
});
</script>
</body>
</html>
