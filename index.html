<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
</head>
<body>Hello World

<div id="player"></div>

<script>
const OWNER = location.hostname.split(".")[0];
const REPO = location.pathname.split("/")[1];
const BRANCH = "main";
const ID_RE = /^[\w-]{11}$/;

// Muestra el video en la página
function mostrar(id) {
  const box = document.getElementById("player");
  box.innerHTML = "";
  const f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + id;
  f.width = "640";
  f.height = "360";
  f.style.maxWidth = "100%";
  f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  box.appendChild(f);
}

// Descarga con yt-dlp (solo si ya guardaste el token en sessionStorage)
async function descargar(id) {
  const token = sessionStorage.getItem("gh_token");
  if (!token) return;
  try {
    const r = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/download.yml/dispatches`,
      {
        method: "POST",
        headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
        body: JSON.stringify({ ref: BRANCH, inputs: { id } })
      }
    );
    document.title = r.status === 204 ? "Workflow lanzado: " + id : "Error " + r.status;
  } catch (e) { console.error(e); }
}

function procesar(id) {
  if (!ID_RE.test(id)) return;
  mostrar(id);
  descargar(id);
}

const q = new URLSearchParams(location.search).get("id");
if (q) procesar(q);

document.addEventListener("paste", (e) => {
  procesar((e.clipboardData.getData("text") || "").trim());
});
</script>
</body>
</html>
